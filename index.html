<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Evōlya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEECE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evōlya">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one phone-width column over a soft two-glow backdrop. Deep emerald "hero" cards carry the numbers
   (ring, session), white rounded cards carry the content, a floating pill tab bar sits at the bottom. */
:root{
  --bg:#EEECE0; --surface:#F8F6EF; --soft:#E4E1D2; --fg:#1C1C1A; --muted:#6A675B; --line:#D9D5C4;
  --accent:#1C1C1A; --accent-fg:#F3F1E8; --accent-soft:#E2DFD0; --accent-text:#1C1C1A;
  --sun:#E7A07A; --sun2:#D77F58; --sun-fg:#2A1306;
  --hero1:#2B2A25; --hero2:#161614; --hero-fg:#F3F1E8; --hero-mute:rgba(243,241,232,.78);
  --prot:#4F6F9C; --carb:#C08A1E; --fat:#B5506C; --fib:#6B8F4E; --warn:#A8531F; --warn-soft:#F3E1D2;
  --ph-m:#B5506C; --ph-f:#5E8C6A; --ph-o:#C08A1E; --ph-l:#7A6AB0;
  --m-petit:#D98A55; --m-midi:#5E8C6A; --m-gouter:#C08A1E; --m-soir:#6F68B0;
  --blob1:rgba(231,160,122,.28); --blob2:rgba(28,28,26,.07);
  --shadow:0 1px 2px rgba(40,36,20,.07),0 14px 30px -14px rgba(40,36,20,.28);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1F1F1B; --soft:#2A2A25; --fg:#EEECE0; --muted:#A4A090; --line:#33322B;
    --accent:#EEECE0; --accent-fg:#1A1A17; --accent-soft:#2D2C26; --accent-text:#EEECE0;
    --sun:#EDAA85; --sun2:#E0875F; --sun-fg:#2A1306;
    --hero1:#37362E; --hero2:#1C1C18; --hero-fg:#F3F1E8; --hero-mute:rgba(243,241,232,.78);
    --prot:#8FB0DE; --carb:#E3B04F; --fat:#E58CA8; --fib:#A2C97F; --warn:#EDA377; --warn-soft:#3A2619;
    --ph-m:#E58CA8; --ph-f:#8BC9A0; --ph-o:#E3B04F; --ph-l:#B3A6E6;
    --m-petit:#EDAA85; --m-midi:#8BC9A0; --m-gouter:#E3B04F; --m-soir:#B3A6E6;
    --blob1:rgba(237,170,133,.12); --blob2:rgba(238,236,224,.05);
    --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1F1F1B; --soft:#2A2A25; --fg:#EEECE0; --muted:#A4A090; --line:#33322B;
  --accent:#EEECE0; --accent-fg:#1A1A17; --accent-soft:#2D2C26; --accent-text:#EEECE0;
  --sun:#EDAA85; --sun2:#E0875F; --sun-fg:#2A1306;
  --hero1:#37362E; --hero2:#1C1C18; --hero-fg:#F3F1E8; --hero-mute:rgba(243,241,232,.78);
  --prot:#8FB0DE; --carb:#E3B04F; --fat:#E58CA8; --fib:#A2C97F; --warn:#EDA377; --warn-soft:#3A2619;
  --ph-m:#E58CA8; --ph-f:#8BC9A0; --ph-o:#E3B04F; --ph-l:#B3A6E6;
  --m-petit:#EDAA85; --m-midi:#8BC9A0; --m-gouter:#E3B04F; --m-soir:#B3A6E6;
  --blob1:rgba(237,170,133,.12); --blob2:rgba(238,236,224,.05);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 132px}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 38% at 105% -4%,var(--blob1),transparent 72%),radial-gradient(70% 44% at -12% 34%,var(--blob2),transparent 72%)}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block}
.eyebrow::first-letter{text-transform:uppercase}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.enter .rv{animation:ringin 1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.enter>*,.enter .rv{animation:none}.spin{animation-duration:2.4s}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brandw{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--hero1),var(--hero2));display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--hero2)}
.logo svg{width:22px;height:22px;fill:none;stroke:var(--sun);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.02em}
.dnav,.weekbar{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.dnav .dl,.weekbar span{padding:0 8px;font-weight:600;font-size:14.5px;white-space:nowrap}
.weekbar{justify-content:space-between}
.rb{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.rb .ic{width:18px;height:18px}
.rb[disabled]{opacity:.35;cursor:default}
.banner{background:var(--warn-soft);border-radius:14px;padding:10px 14px;font-size:14px}
.greet{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 20px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn .ic{width:20px;height:20px}
.btn.sun{background:var(--accent);color:var(--accent-fg);box-shadow:0 12px 24px -12px var(--fg);font-size:17px;min-height:56px}
.btn.tonal{background:var(--surface);color:var(--accent-text);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff}
.btn.text{background:none;color:var(--accent-text);padding:10px 8px;min-height:40px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.cta{display:flex;flex-direction:column;gap:10px}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.in{width:100%;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;margin-bottom:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.opt{display:block;position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt .oc{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:background .15s,border-color .15s}
.opt .oc b{display:block;font-weight:600}
.opt .oc small{color:var(--muted);font-size:13.5px}
.opt input:checked+.oc{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible+.oc{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .opt{flex:1 1 0;min-width:96px}
.seg .oc{text-align:center;padding:10px 8px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goals .oc{display:flex;flex-direction:column;gap:8px;min-height:122px}
.gi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.opt input:checked+.oc .gi{background:var(--accent);color:var(--accent-fg)}

/* chips & tags */
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:var(--shadow)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft)}
.tag .ic{width:14px;height:14px}
.tag.ok{background:var(--accent-soft);color:var(--accent-text)}
.mt{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.mt .ic{width:15px;height:15px}
.metas{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gauge{display:inline-flex;gap:3px;align-items:flex-end}
.gauge i{width:5px;border-radius:2px;background:currentColor;opacity:.3}
.gauge i:nth-child(1){height:8px}.gauge i:nth-child(2){height:12px}.gauge i:nth-child(3){height:16px}
.gauge i.on{opacity:1}

/* cards */
.card,.app>.panel{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.card.tint{background:var(--accent-soft)}
.panel{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px;color:var(--hero-fg);background:linear-gradient(150deg,var(--hero1),var(--hero2));box-shadow:0 22px 40px -22px var(--hero2)}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-100px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,155,102,.55),transparent);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring-wrap{position:relative;width:156px;height:156px}
.ring{width:100%;height:100%;display:block}
.rt{stroke:rgba(255,255,255,.17)}
.rv{stroke:var(--sun)}
.rv.over{stroke:#FFC9B8}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ring-c b{font-family:var(--display);font-size:36px;line-height:1;letter-spacing:-.03em}
.ring-c span{font-size:12px;color:var(--hero-mute);max-width:90px}
.hstats{display:flex;flex-direction:column;gap:12px;min-width:0}
.hs span{display:block;font-size:12.5px;color:var(--hero-mute);font-weight:500}
.hs b{font-family:var(--display);font-size:24px;line-height:1.1;letter-spacing:-.02em}
.hs.s2 b{font-size:18px;color:var(--sun)}
.macs{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.mc{display:flex;flex-direction:column;gap:7px;min-width:0}
.mh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.mh i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mval{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mval em{font-family:var(--body);font-style:normal;font-weight:500;font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c,var(--accent))}
.bar.thin{height:7px}

/* meals, cravings, activities */
.meals{display:flex;flex-direction:column;gap:10px}
.meal,.cr{background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.meal>summary{list-style:none;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.meal>summary::-webkit-details-marker{display:none}
.bub{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--c);flex:none}
.meal .n,.cr .n{font-weight:600;overflow-wrap:anywhere;min-width:0}
.meal .n small,.cr .n small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-weight:500;font-size:12.5px;color:var(--muted)}
.pl{display:inline-flex;align-items:center;gap:5px}
.pl i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--c)}
.meal .k{font-family:var(--display);font-weight:700;font-size:20px;text-align:right;line-height:1.1}
.meal .k small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px}
.meal .det{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;border-top:1px solid var(--line);padding-top:14px;margin:0 2px}
.meal ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.meal li{display:flex;justify-content:space-between;gap:12px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:600}
.kv span em{font-style:normal;font-weight:400;color:var(--muted)}
.cr{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.empty{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.empty b{font-family:var(--display);font-size:17px}
.feel{display:flex;flex-direction:column;gap:8px}
.fcs{display:flex;flex-wrap:wrap;gap:8px}
.fc{min-height:38px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.fc[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}

/* session (dark card) */
.sess,.pd.dark{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:var(--hero-fg);background:linear-gradient(160deg,var(--hero2),var(--hero1) 140%);display:flex;flex-direction:column;gap:12px;box-shadow:0 22px 40px -24px var(--hero2)}
.sess::after,.pd.dark::after{content:"";position:absolute;width:200px;height:200px;left:-80px;bottom:-110px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,155,102,.4),transparent);pointer-events:none}
.sess>*,.pd.dark>*{position:relative;z-index:1}
.sess .eyebrow,.pd.dark .eyebrow,.sess .muted,.pd.dark .muted{color:var(--hero-mute)}
.sess .tag.ok,.pd.dark .tag.ok{background:rgba(255,255,255,.18);color:#fff}
.pd.dark .chip{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.s-title{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.015em}
.win{background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.win b{font-family:var(--display);font-size:26px;display:block;letter-spacing:-.02em}
.sess .win{background:rgba(255,255,255,.13)}
.sess .win b{color:var(--sun)}
.warn{background:var(--warn-soft);border-radius:16px;padding:11px 14px;font-size:14.5px;color:var(--fg)}
.sess .btn:not(.glass){background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--sun-fg)}
.sess .btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}

/* advice */
.adv{display:flex;flex-direction:column;gap:14px}
.adv-h{display:flex;align-items:center;gap:12px}
.adv-h .bub{width:40px;height:40px;border-radius:13px;background:var(--surface)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{position:relative;padding-left:20px;font-size:15px}
.tips li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.idea{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:16px;background:var(--surface);margin-top:8px}
.idea .ic{color:var(--accent-text);margin-top:2px}
.idea b{font-weight:600;display:block}
.idea span{font-size:13.5px;color:var(--muted)}
.mv{display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--prot) 14%,var(--surface));border-radius:20px;padding:16px}
.mv ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.mv li b{font-weight:600}
.mv li span{display:block;font-size:14px;color:var(--muted)}
.ai-out{white-space:pre-line;font-size:15px}
.status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--soft)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* meal editor */
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:1.5px dashed var(--accent);border-radius:24px;padding:30px 16px;cursor:pointer;background:var(--accent-soft);position:relative;overflow:hidden}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{font-family:var(--display);font-size:19px}
.prev{width:100%;max-height:280px;object-fit:cover;border-radius:20px;display:block}
.it{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.it-top{display:flex;gap:8px}
.it-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.it-grid .q{grid-column:1/-1}
.it-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.it-grid .in{padding:9px 8px}
.x{flex:none;width:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.tot{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:600;padding:12px 0;border-top:1px solid var(--line)}
.tot span em{font-style:normal;color:var(--muted);font-weight:400}

/* plan */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;min-width:0}
.sd b{font-family:var(--display);font-size:19px;color:var(--fg);line-height:1.1}
.sd.tod{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.sd.sel{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-mute)}
.sd.sel b{color:#fff}
.dots{display:flex;gap:3px;height:8px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--muted)}
.dots i.on{background:var(--sun2)}
.dots i.hol{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.pd{border-radius:28px;padding:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.pd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pd h2{font-size:26px;margin-top:4px}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles4 div{background:var(--soft);border-radius:16px;padding:10px 8px;text-align:center;min-width:0}
.pd.dark .tiles4 div{background:rgba(255,255,255,.13)}
.tiles4 b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.tiles4 span{font-size:11.5px;color:var(--muted);font-weight:600}
.pd.dark .tiles4 span{color:var(--hero-mute)}
.nu{background:var(--accent-soft);border-radius:18px;padding:13px 15px;font-size:14.5px}
.pd.dark .nu{background:rgba(255,255,255,.13);color:#fff}
.ovr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 14px;border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);cursor:pointer}
.ovr .dw{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;line-height:1.1;text-align:center}
.ovr .dw b{display:block;font-family:var(--display);font-size:19px;color:var(--fg)}
.ovr .st{font-weight:600;overflow-wrap:anywhere}
.ovr .st small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ovr .kc{font-size:13px;color:var(--muted);white-space:nowrap}
.ovr[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.ovl{display:flex;flex-direction:column;gap:8px}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.wl{display:flex;flex-direction:column}
.wl div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.sum div{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:18px;padding:12px 14px}
.sum b{font-family:var(--display);font-size:25px;line-height:1.1;letter-spacing:-.02em}
.sum span{font-size:12.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;border-radius:30px;padding:24px 22px;color:var(--hero-fg);background:linear-gradient(150deg,var(--hero1),var(--hero2));box-shadow:0 22px 40px -22px var(--hero2)}
.welcome::after{content:"";position:absolute;width:240px;height:240px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,155,102,.55),transparent)}
.welcome>*{position:relative;z-index:1}
.welcome p{color:var(--hero-mute);max-width:34ch}

/* floating tab bar + toast */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#tabs .in-tabs{pointer-events:auto;display:flex;width:100%;max-width:440px;gap:4px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 16px 36px -14px rgba(8,40,32,.45),0 0 0 1px var(--line)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border:0;background:none;border-radius:20px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0;transition:background .15s,color .15s}
.tb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-current="page"]{color:var(--accent-fg);background:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14.5px;font-weight:500;max-width:min(92vw,420px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.foot{font-size:12.5px;color:var(--muted)}

/* cuisine */
.stepper{display:inline-flex;align-items:center;gap:14px}
.stepper b{font-family:var(--display);font-size:24px;min-width:30px;text-align:center}
.stepper .rb{width:44px;height:44px;font-size:22px;font-weight:600;line-height:1}
.metas2{display:flex;flex-wrap:wrap;gap:8px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px 16px;font-size:15px;align-items:baseline}
.ing .lbl{font-size:12.5px}
.ing b{text-align:right;font-weight:600}
.ing span:nth-child(3n+2){text-align:right;color:var(--muted)}
.ing .lbl:nth-child(3){text-align:right}
.ideac{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steps li::marker{font-family:var(--display);font-weight:700;color:var(--accent-text)}

<script>
(function(){
'use strict';

/*PURE-START*/
const n=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r1=v=>Math.round(v*10)/10;
const mins=t=>{const a=String(t||'0:0').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)};
const hm=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?h+' h '+String(r).padStart(2,'0'):h+' h'):r+' min'};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function addDays(s,k){const d=parse(s);d.setDate(d.getDate()+k);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function wk(s){return (parse(s).getDay()+6)%7}
function mondayOf(s){return addDays(s,-wk(s))}

const PH={
  menstrual:{label:'Règles',level:'low',kcal:0,col:'--ph-m',
    nutri:'Fer et hydratation : lentilles, viande, œufs ou épinards avec une source de vitamine C. Magnésium avec amandes ou chocolat noir.',
    train:'L’énergie est souvent plus basse. Si tu te sens bien, garde ta séance habituelle, sinon prends la version douce.'},
  folliculaire:{label:'Folliculaire',level:'high',kcal:0,col:'--ph-f',
    nutri:'Les glucides passent bien : place-les autour de la séance. Des protéines à chaque repas.',
    train:'Énergie et récupération en hausse : bon moment pour monter les charges ou l’intensité.'},
  ovulation:{label:'Ovulation',level:'high',kcal:0,col:'--ph-o',
    nutri:'Bien s’hydrater, légumes et fibres à chaque repas, repas réguliers pour garder l’énergie.',
    train:'Pic de force possible. Échauffement long, surtout genoux et chevilles, et une technique soignée.'},
  luteale:{label:'Lutéale',level:'mid',kcal:100,col:'--ph-l',
    nutri:'L’appétit monte souvent. Environ 100 kcal de plus, riches en protéines et en fibres, pour tenir entre les repas.',
    train:'Intensité modérée, repos un peu plus longs entre les séries. La régularité compte plus que la performance.'},
  'luteale-fin':{label:'Lutéale (fin)',level:'low',kcal:100,col:'--ph-l',
    nutri:'Les envies sucrées sont fréquentes : prévois une collation (yaourt grec, fruit, chocolat noir). Magnésium et sommeil aident.',
    train:'Fatigue ou ballonnements possibles : séance plus douce ou plus courte si besoin.'}
};

const L=(f,lo,mi,hi)=>({f:f,low:lo,mid:mi,high:hi});
const LIB={
  perdre:[
    L('Force corps entier',['Renforcement léger au poids du corps',30,'3 tours : squats, pompes inclinées, pont fessier, gainage 30 s.'],['Force corps entier',45,'4 exercices × 3 séries de 10 à 12 : squat gobelet, développé, tirage, fentes. Repos 60 à 90 s.'],['Force corps entier, charges plus lourdes',50,'4 mouvements polyarticulaires × 4 séries de 6 à 10, puis 5 min de finisher.']),
    L('Endurance',['Marche rapide ou vélo tranquille',40,'Allure où tu peux encore chanter.'],['Cardio en endurance',40,'Vélo, course facile ou rameur, allure où tu peux parler.'],['Cardio en endurance longue',55,'Même allure confortable, plus longtemps. Pense à t’hydrater.']),
    L('Intervalles',['Yoga ou étirements actifs',30,'Mobilité des hanches, du dos et des épaules.'],['Intervalles doux',30,'5 min d’échauffement puis 8 × (1 min soutenue, 1 min 30 facile).'],['HIIT court',25,'Échauffement puis 10 × (30 s rapide, 60 s de récupération).']),
    L('Bas du corps et gainage',['Mobilité et gainage doux',30,'Pont fessier, planche, oiseau-chien, étirements des hanches.'],['Bas du corps et gainage',45,'Squat, fentes, soulevé de terre roumain, hip thrust, planche.'],['Bas du corps, charges lourdes',50,'Squat et soulevé de terre en 4 × 6 à 8, puis gainage.']),
    L('Marche active',['Longue marche tranquille',45,'Allure souple, sans objectif de performance.'],['Marche active ou vélo',50,'Allure soutenue, vallonnée si possible.'],['Marche en côte ou circuit cardio',50,'Alterne côtes et plat, 6 à 8 répétitions soutenues.'])
  ],
  prendre:[
    L('Haut du corps',['Haut du corps léger',35,'2 séries de chaque exercice, charges réduites.'],['Haut du corps',50,'Développé couché, tirage, développé épaules, rowing, 3 à 4 × 6 à 10.'],['Haut du corps lourd',60,'Séries lourdes de 5 à 8 sur les mouvements de base, repos 2 à 3 min.']),
    L('Bas du corps',['Bas du corps léger',35,'Squat, fentes et pont fessier en 2 séries, charges réduites.'],['Bas du corps',50,'Squat, soulevé de terre roumain, presse, mollets, 3 à 4 × 6 à 10.'],['Bas du corps lourd',60,'Squat et soulevé de terre en 5 × 5, accessoires en 3 × 8.']),
    L('Corps entier',['Corps entier léger',35,'Un exercice par grand groupe musculaire, 2 séries.'],['Force corps entier',55,'Squat, développé, tirage, fentes, gainage, 3 × 8 à 10.'],['Corps entier, séries lourdes',60,'3 mouvements de base en 4 × 5 à 6, puis accessoires.']),
    L('Haut du corps (volume)',['Haut du corps technique',35,'Séries légères, tempo lent, amplitude complète.'],['Haut du corps, volume',50,'5 exercices en 3 × 10 à 12, bras et épaules inclus.'],['Haut du corps, volume élevé',60,'Séries 4 × 8 à 12, dernières séries proches de l’échec.']),
    L('Bas du corps (volume)',['Bas du corps technique',35,'Séries légères, tempo lent, gainage.'],['Bas du corps, volume',50,'5 exercices en 3 × 10 à 12.'],['Bas du corps, volume élevé',60,'Séries 4 × 8 à 12, fentes marchées et mollets en finisher.'])
  ],
  muscle:[
    L('Push',['Push léger',35,'Pompes, développé léger, élévations latérales, 2 séries.'],['Push : pectoraux, épaules, triceps',50,'Développé, développé incliné, élévations latérales, triceps, 3 à 4 × 8 à 12.'],['Push lourd',60,'Développé en 4 × 5 à 8, puis accessoires en 3 × 10.']),
    L('Pull',['Pull léger',35,'Tirage, rowing léger, curl, 2 séries.'],['Pull : dos et biceps',50,'Tractions ou tirage, rowing, face pull, curl, 3 à 4 × 8 à 12.'],['Pull lourd',60,'Tractions lestées ou tirage en 4 × 5 à 8, rowing lourd, curl.']),
    L('Legs',['Jambes légères et mobilité',35,'Squat gobelet, fentes, pont fessier, 2 séries.'],['Legs : jambes',55,'Squat, presse, soulevé de terre roumain, extensions, mollets, 3 à 4 × 8 à 12.'],['Legs lourd',60,'Squat en 5 × 5, soulevé de terre roumain en 4 × 6 à 8, accessoires.']),
    L('Haut du corps',['Haut du corps technique',35,'Séries légères, tempo lent.'],['Haut du corps',50,'2 poussées, 2 tirages, 1 exercice bras, 3 × 8 à 12.'],['Haut du corps, intensité haute',60,'Séries proches de l’échec sur les 2 derniers exercices.']),
    L('Bas du corps et abdos',['Bas du corps doux et abdos',35,'Pont fessier, fentes, gainage, 2 séries.'],['Bas du corps et abdos',50,'Fentes, hip thrust, leg curl, gainage, 3 × 10 à 12.'],['Bas du corps et abdos, intense',60,'Hip thrust lourd, fentes bulgares, gainage lesté.']),
    L('Corps entier',['Corps entier léger',35,'Un exercice par grand groupe musculaire.'],['Corps entier',55,'Squat, développé, tirage, fentes, gainage, 3 × 8 à 10.'],['Corps entier, lourd',60,'Mouvements de base en 4 × 5 à 6.'])
  ],
  maintenir:[
    L('Force corps entier',['Renforcement léger',30,'Poids du corps, 2 tours.'],['Force corps entier',45,'Squat, développé, tirage, fentes, gainage, 3 × 10.'],['Force corps entier, plus lourd',50,'4 exercices en 4 × 6 à 8.']),
    L('Cardio',['Marche rapide ou vélo tranquille',35,'Allure facile.'],['Cardio en endurance',40,'Allure où tu peux parler.'],['Cardio avec intervalles',40,'6 × (2 min soutenues, 2 min faciles).']),
    L('Haut du corps et gainage',['Mobilité et gainage',30,'Planches, rotations, étirements.'],['Haut du corps et gainage',45,'Pompes, tirage, épaules, gainage.'],['Haut du corps et gainage, intense',50,'Séries plus lourdes et gainage lesté.']),
    L('Bas du corps',['Bas du corps doux',30,'Squat, pont fessier, étirements.'],['Bas du corps',45,'Squat, fentes, soulevé de terre roumain, mollets.'],['Bas du corps, plus lourd',50,'4 × 6 à 8 sur squat et soulevé de terre.']),
    L('Mobilité',['Yoga ou étirements',30,'Hanches, dos, épaules.'],['Yoga ou pilates',40,'Travail de souplesse et de gainage.'],['Pilates dynamique',40,'Rythme soutenu, contrôle du centre.'])
  ]
};
const REST={
  perdre:'Marche 30 à 45 min et quelques étirements. Les pas comptent autant que les séances.',
  prendre:'Marche légère et mobilité. Le muscle se construit pendant la récupération : garde tous tes repas.',
  muscle:'Marche légère et mobilité. La récupération fait partie du programme : garde tous tes repas.',
  maintenir:'Marche libre et étirements, sans objectif de performance.'
};
const POST={
  perdre:'Après la séance : 25 à 30 g de protéines (skyr, œufs, poulet) avec des légumes et des glucides modérés.',
  prendre:'Après la séance : 30 à 40 g de protéines et 60 à 100 g de glucides (riz, pâtes, pain, fruit).',
  muscle:'Après la séance : 30 à 40 g de protéines et 50 à 80 g de glucides dans les 2 heures.',
  maintenir:'Après la séance : un repas équilibré avec des protéines dans les 2 heures.'
};
const PAT={2:[1,4],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
const SLOT={matin:'07:00',midi:'12:15',soir:'18:00'};
const GOALS={perdre:'Perdre du poids',muscle:'Prendre de la masse musculaire',prendre:'Prendre du poids',maintenir:'Garder mon poids'};

function phaseFor(p,date){
  if(!p||!p.cycleOn||!p.lastPeriod) return null;
  const Lc=clamp(Math.round(p.cycleLen||28),21,40), per=clamp(Math.round(p.periodLen||5),2,8);
  const day=((diffDays(p.lastPeriod,date)%Lc)+Lc)%Lc+1, ov=Lc-14;
  let key;
  if(day<=per) key='menstrual';
  else if(day<ov-1) key='folliculaire';
  else if(day<=ov+1) key='ovulation';
  else if(day>Lc-5) key='luteale-fin';
  else key='luteale';
  return Object.assign({key:key,day:day,len:Lc},PH[key]);
}

function targets(p,adj){
  const w=p.weight,h=p.height,a=p.age;
  const bmr=10*w+6.25*h-5*a+(p.sex==='h'?5:-161);
  const tdee=bmr*p.activity;
  const pace=p.pace||'modere';
  const pct={perdre:{doux:-.10,modere:-.15,soutenu:-.20},prendre:{doux:.08,modere:.12,soutenu:.16},muscle:{doux:.05,modere:.10,soutenu:.15},maintenir:{doux:0,modere:0,soutenu:0}}[p.goal][pace];
  let kcal=tdee*(1+pct)+(p.tweak||0)+(adj||0);
  const floor=Math.max(bmr,p.sex==='h'?1500:1200);
  let floored=false;
  if(p.goal==='perdre'&&kcal<floor){kcal=floor;floored=true}
  kcal=Math.round(kcal/10)*10;
  const pg={perdre:1.8,muscle:2.0,prendre:1.6,maintenir:1.4}[p.goal];
  const protein=Math.round(pg*w);
  const fat=Math.round(kcal*0.25/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  const fiber=Math.round(kcal/1000*14);
  const rate=(kcal-(adj||0)-tdee)*7/7700;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:kcal,protein:protein,fat:fat,carbs:carbs,fiber:fiber,rate:rate,floored:floored};
}

function planFor(p,date){
  const dw=wk(date), pat=PAT[p.days||4]||PAT[4], k=pat.indexOf(dw);
  const ph=phaseFor(p,date), level=ph?ph.level:'mid';
  const T=targets(p,ph?ph.kcal:0);
  const out={date:date,ph:ph,T:T,level:level,time:SLOT[p.slot||'soir']};
  if(k<0){
    out.rest=true;
    out.title=dw===6?'Repos ou balade':'Récupération active';
    out.detail=REST[p.goal];
    return out;
  }
  const lib=LIB[p.goal], base=lib[k%lib.length], v=base[level];
  out.rest=false;out.focus=base.f;out.title=v[0];out.min=v[1];out.detail=v[2];
  return out;
}

const sumItems=items=>(items||[]).reduce((a,i)=>({kcal:a.kcal+n(i.kcal),p:a.p+n(i.p),c:a.c+n(i.c),f:a.f+n(i.f),fib:a.fib+n(i.fib)}),{kcal:0,p:0,c:0,f:0,fib:0});
const sumMeals=ms=>ms.reduce((a,m)=>{const s=sumItems(m.items);return {kcal:a.kcal+s.kcal,p:a.p+s.p,c:a.c+s.c,f:a.f+s.f,fib:a.fib+s.fib}},{kcal:0,p:0,c:0,f:0,fib:0});

function slotAdvice(plan,meals,kcalSoFar,target,nowMin,goal){
  const r={lines:[],window:null,late:false,warn:null,post:POST[goal]};
  const past=meals.filter(m=>mins(m.time)<=nowMin).sort((a,b)=>mins(a.time)-mins(b.time));
  const kc=m=>sumItems(m.items).kcal;
  const main=past.filter(m=>kc(m)>=350).pop();
  const last=past[past.length-1];
  let start=nowMin;
  if(main){
    const k=kc(main), wait=k>=800?180:k>=550?150:120;
    start=Math.max(nowMin,mins(main.time)+wait);
    r.lines.push('Dernier vrai repas à '+main.time+' ('+Math.round(k)+' kcal) : compte '+dur(wait)+' de digestion avant une séance intense.');
    if(nowMin-mins(main.time)>240&&last===main) r.lines.push('Plus de 4 h depuis ce repas : un en-cas avec glucides et protéines 30 à 60 min avant la séance aide à tenir.');
  } else if(last){
    start=Math.max(nowMin,mins(last.time)+45);
    r.lines.push('Seulement une collation à '+last.time+' : une séance est possible 45 min après, de préférence modérée.');
  } else {
    start=nowMin+45;
    r.lines.push('Rien de saisi pour l’instant. Prends un en-cas (banane et yaourt, ou pain et œuf) puis entraîne-toi 45 à 60 min plus tard. Une séance légère à jeun reste possible si tu en as l’habitude.');
  }
  if(start>21*60+30) r.late=true; else r.window=[start,Math.min(start+90,22*60)];
  if(plan.level==='high'&&nowMin>=15*60&&kcalSoFar<0.35*target) r.warn='Tu as peu mangé pour une séance intense. Mange d’abord, ou choisis une version plus douce.';
  return r;
}

function weightTrend(ws,today){
  const cut=addDays(today,-35);
  const a=ws.filter(w=>w.d>=cut).sort((x,y)=>x.d<y.d?-1:1);
  if(a.length<2) return null;
  const f=a[0],l=a[a.length-1],span=diffDays(f.d,l.d);
  if(span<7) return null;
  return {rate:(l.kg-f.kg)/(span/7),span:span,from:f,to:l};
}
function tweakAdvice(p,tr){
  if(!tr||tr.span<14) return null;
  const r=tr.rate;
  if(p.goal==='perdre'){

function pickIdeas(slot,want,avoid,seed){

    let h=0;const str=seed+i.t;for(let k=0;k<str.length;k++) h=(h*31+str.charCodeAt(k))%997;

const AICON={chiens:'paw',marche:'steps',natation:'wave',velo:'bike',course:'bolt',muscu:'dumbbell',hiit:'heart',yoga:'leaf',rando:'mountain',autre:'bolt'};
const bub=(k,c)=>'<span class="bub" style="--c:var('+c+')">'+ic(k)+'</span>';
const pill=(c,v,l)=>'<span class="pl" style="--c:var('+c+')"><i></i>'+l+' '+fr(v)+'</span>';
const gauge=l=>{const k={low:1,mid:2,high:3}[l]||2;return '<span class="gauge">'+[1,2,3].map(i=>'<i'+(i<=k?' class="on"':'')+'></i>').join('')+'</span>'+({low:'Douce',mid:'Modérée',high:'Intense'}[l]||'')};

/* ---------- views ---------- */
function chip(ph){return ph?'<span class="chip" style="--c:var('+ph.col+')"><i></i>'+esc(ph.label)+' · J'+ph.day+'</span>':''}
function bar(v,t,c){const w=t>0?clamp(v/t*100,0,100):0;return '<div class="bar thin" role="img" aria-label="'+Math.round(w)+' %"><i style="width:'+w+'%;--c:var('+c+')"></i></div>'}
function logo(){return '<span class="logo"><img src="icons/logo.png" alt="" style="width:100%;height:100%;border-radius:inherit;display:block"></span>'}

function head(){
  const showNav=S.tab==='today'&&!S.draft&&!S.cdraft&&!S.adraft&&S.profile;
  let h='<div class="topbar"><div class="brandw">'+logo()+'<span class="brand">Evōlya</span></div>';
  if(showNav){
    h+='<div class="dnav"><button class="rb" data-act="day" data-v="-1" aria-label="Jour précédent">'+ic('chevL')+'</button><span class="dl">'+esc(new Date(parse(S.viewDate)).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}))+'</span><button class="rb" data-act="day" data-v="1" aria-label="Jour suivant"'+(S.viewDate>=TODAY?' disabled':'')+'>'+ic('chevR')+'</button></div>';
  }
  h+='</div>';
  if(S.syncErr) h+='<div class="banner">La sauvegarde en ligne a échoué. Tes données restent enregistrées sur cet appareil.</div>';
  else if(S.dbChecked&&!S.hasDb) h+='<div class="banner">Sauvegarde en ligne indisponible : tes données restent sur cet appareil.</div>';

function sessionCard(p,date,meals,tot,acts){
  const plan=planFor(p,date), done=!!S.done[date], isToday=date===TODAY;
  let h='<section class="sess"><div class="sess-h"><span class="eyebrow">Séance du jour</span>'+(done?'<span class="tag ok">'+ic('check')+'Faite</span>':'')+'</div>';
  h+='<div class="s-title">'+esc(plan.title)+'</div>';
  h+='<div class="metas">'+(plan.rest?'<span class="mt">Pas de séance prévue</span>':'<span class="mt">'+ic('clock')+esc(plan.time)+'</span><span class="mt">'+esc(plan.min+' min')+'</span><span class="mt">'+gauge(plan.level)+'</span>')+'</div>';
  h+='<p>'+esc(plan.detail)+'</p>';
  if(plan.ph) h+='<p class="small muted">'+esc(plan.ph.train)+'</p>';
  if(isToday&&!plan.rest&&!done){
    const d=new Date(),now=d.getHours()*60+d.getMinutes();
    const a=slotAdvice(plan,meals,tot.kcal,plan.T.kcal,now,p.goal);
    if(a.window){
      const wait=a.window[0]-now;
      h+='<div class="win"><span class="small muted">Créneau conseillé selon tes repas</span><b class="tnum">'+hm(a.window[0])+' à '+hm(a.window[1])+'</b>'+(wait>5?'<span class="small">Dans '+dur(wait)+'</span>':'<span class="small">C’est possible maintenant</span>')+'</div>';
    } else h+='<div class="win"><b>Plutôt demain</b><span class="small">Trop tard pour une séance intense (sommeil). Fais 20 min de mobilité ou décale à demain matin.</span></div>';
    a.lines.forEach(l=>{h+='<p class="small">'+esc(l)+'</p>'});
    if(a.warn) h+='<div class="warn">'+esc(a.warn)+'</div>';
    const hard=(acts||[]).filter(x=>x.type!=='chiens'&&x.type!=='marche'&&x.type!=='yoga');
    const hardMin=hard.reduce((s,x)=>s+n(x.min),0);
    if(hardMin>=45) h+='<div class="warn">Tu as déjà fait '+hardMin+' min d’activité soutenue aujourd’hui ('+esc(hard.map(x=>(ACT[x.type]||ACT.autre).l.toLowerCase()).join(', '))+'). Choisis la version douce de la séance, ou compte cette activité comme ta séance.</div>';
    h+='<p class="small muted">'+esc(a.post)+'</p>';
  } else if(!plan.rest&&done&&isToday){
    h+='<p class="small muted">'+esc(POST[p.goal])+'</p>';
  }
  if(!plan.rest) h+='<div class="row"><button class="btn '+(done?'ghost':'')+'" data-act="done" data-d="'+date+'">'+(done?'Marquer comme non faite':ic('check')+'Séance faite')+'</button></div>';
  return h+'</section>';
}

function renderToday(){
  const p=pn();
  if(!p) return renderProfile();
  const date=S.viewDate, isToday=date===TODAY, meals=getMeals(date), acts=getActs(date), tot=sumMeals(meals), ph=phaseFor(p,date);
  const bonus=actBonus(acts,p.weight), T=targets(p,(ph?ph.kcal:0)+bonus);
  const left=T.kcal-tot.kcal, gain=p.goal==='prendre'||p.goal==='muscle', over=left<0;
  const hr=new Date().getHours();
  const hello=hr<5?'Bonne nuit':hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir';
  const dlab=new Date(parse(date)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  let h='<div class="greet"><span class="eyebrow">'+esc(dlab)+'</span><h1>'+(isToday?esc(hello+(p.name?', '+p.name:'')):'Ce jour-là')+'</h1>'+(ph?'<div>'+chip(ph)+'</div>':'')+'</div>';
  /* hero : anneau de calories */
  const C=2*Math.PI*70, frac=clamp(tot.kcal/T.kcal,0,1);
  h+='<section class="hero"><div class="hero-in"><div class="ring-wrap"><svg class="ring" viewBox="0 0 160 160" role="img" aria-label="Calories du jour"><circle class="rt" cx="80" cy="80" r="70" fill="none" stroke-width="14"/><circle class="rv'+(over&&!gain?' over':'')+'" cx="80" cy="80" r="70" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'" style="--c:'+C.toFixed(1)+'" transform="rotate(-90 80 80)"/></svg>'
    +'<div class="ring-c"><b class="tnum">'+fr(Math.abs(left))+'</b><span>'+(over?'kcal au-dessus de la cible':gain?'kcal à atteindre':'kcal restantes')+'</span></div></div>'
    +'<div class="hstats"><div class="hs"><span>Mangé</span><b class="tnum">'+fr(tot.kcal)+' kcal</b></div><div class="hs"><span>Cible du jour</span><b class="tnum">'+fr(T.kcal)+' kcal</b></div>'+(bonus>0?'<div class="hs s2"><span>Dont activités</span><b class="tnum">+'+fr(bonus)+' kcal</b></div>':'')+'</div></div></section>';
  h+='<section class="card macs">'
    +'<div class="mc"><div class="mh"><i style="background:var(--prot)"></i>Protéines</div><div class="mval tnum">'+fr(tot.p)+'<em> / '+T.protein+' g</em></div>'+bar(tot.p,T.protein,'--prot')+'</div>'
    +'<div class="mc"><div class="mh"><i style="background:var(--carb)"></i>Glucides</div><div class="mval tnum">'+fr(tot.c)+'<em> / '+T.carbs+' g</em></div>'+bar(tot.c,T.carbs,'--carb')+'</div>'
    +'<div class="mc"><div class="mh"><i style="background:var(--fat)"></i>Lipides</div><div class="mval tnum">'+fr(tot.f)+'<em> / '+T.fat+' g</em></div>'+bar(tot.f,T.fat,'--fat')+'</div>'
    +'<div class="mc"><div class="mh"><i style="background:var(--fib)"></i>Fibres</div><div class="mval tnum">'+fr(tot.fib)+'<em> / '+T.fiber+' g</em></div>'+bar(tot.fib,T.fiber,'--fib')+'</div></section>';
  h+='<div class="cta"><button class="btn sun" data-act="add-meal">'+ic('camera')+'Ajouter un repas</button><div class="cta2"><button class="btn tonal" data-act="add-activity">'+ic('bolt')+'Activité</button><button class="btn tonal" data-act="add-craving">'+ic('heart')+'Fringale</button></div></div>';
  const crs=getCravings(date), d0=new Date(), nowMin=d0.getHours()*60+d0.getMinutes();
  const wk7=weekCravings();
  const adv=buildAdvice({p:p,date:date,meals:meals,cravings:crs,activities:acts,nowMin:nowMin,T:T,tot:tot,ph:ph,isToday:isToday,weekStrong:wk7.filter(x=>x.force>=2).length});
  h+=adviceHtml(adv,isToday,crs.length||meals.some(m=>m.feel));
  h+='<section><div class="sec-h"><h2>Repas</h2>'+(meals.length?'<span class="small muted tnum">'+meals.length+(meals.length>1?' repas':' repas')+'</span>':'')+'</div>';
  if(!meals.length) h+='<div class="empty">'+bub('camera','--m-midi')+'<div><b>Aucun repas noté</b><p class="small muted">Une photo et un commentaire suffisent : calories et nutriments sont calculés pour toi.</p></div></div>';
  else{
    h+='<div class="meals">';
    meals.forEach(m=>{
      const s=sumItems(m.items), mt=MT[m.type]||MT['Collation'];
      h+='<details class="meal"><summary>'+bub(mt[0],mt[1])+'<span class="n">'+esc(m.titre||m.type)+'<small>'+esc(m.time+' · '+m.type+(m.feel?' · '+FEEL[m.feel]:''))+'</small><span class="pills tnum">'+pill('--prot',s.p,'P')+pill('--carb',s.c,'G')+pill('--fat',s.f,'L')+'</span></span><span class="k tnum">'+fr(s.kcal)+'<small>kcal</small></span></summary><div class="det"><ul>';
      (m.items||[]).forEach(i=>{h+='<li><span>'+esc(i.nom)+(i.qte?' · '+esc(i.qte):'')+'</span><span class="tnum muted">'+fr(n(i.kcal))+' kcal</span></li>'});
      h+='</ul><div class="kv tnum"><span><em>Prot.</em> '+fr(s.p)+' g</span><span><em>Gluc.</em> '+fr(s.c)+' g</span><span><em>Lip.</em> '+fr(s.f)+' g</span><span><em>Fibres</em> '+fr(s.fib)+' g</span></div>';
      if(m.note) h+='<p class="small muted">'+esc(m.note)+'</p>';
      h+='<div class="feel"><span class="lbl">Comment tu t’es senti après ?</span><div class="fcs">'+Object.keys(FEEL).map(k=>'<button class="fc" data-act="feel" data-id="'+esc(m.id)+'" data-v="'+k+'" aria-pressed="'+(m.feel===k)+'">'+esc(FEEL[k])+'</button>').join('')+'</div></div>';
      h+='<div><button class="btn ghost sm" data-act="rm-meal" data-id="'+esc(m.id)+'">Supprimer ce repas</button></div></div></details>';
    });
    h+='</div>';
  }
  h+='</section>';
  if(crs.length){
    h+='<section><div class="sec-h"><h2>Fringales</h2></div><div class="meals">';
    crs.forEach(x=>{
      h+='<div class="cr">'+bub('heart','--fat')+'<span class="n">'+esc((FORCE[x.force]||'')+' · '+(CTYPE[x.type]||''))+'<small>'+esc(x.time+((x.ctx&&x.ctx.length)?' · '+x.ctx.map(k=>CTX[k]).filter(Boolean).join(', '):'')+(x.feel?' · '+FEEL[x.feel]:''))+'</small>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</span><button class="btn text sm" data-act="rm-craving" data-id="'+esc(x.id)+'">Retirer</button></div>';
    });
    h+='</div></section>';
  }
  if(acts.length){
    h+='<section><div class="sec-h"><h2>Activités</h2><span class="small muted tnum">'+acts.reduce((s,a)=>s+n(a.min),0)+' min</span></div><div class="meals">';
    acts.forEach(a=>{
      const t=ACT[a.type]||ACT.autre;
      h+='<div class="cr">'+bub(AICON[a.type]||'bolt','--prot')+'<span class="n">'+esc(t.l)+'<small>'+esc(a.time+' · '+a.min+' min · '+(INTL[a.int]||'')+' · environ '+fr(actKcal(a,p.weight))+' kcal')+'</small>'+(a.note?'<small>'+esc(a.note)+'</small>':'')+'</span><button class="btn text sm" data-act="rm-activity" data-id="'+esc(a.id)+'">Retirer</button></div>';
    });
    h+='</div></section>';
  }
  h+=sessionCard(p,date,meals,tot,acts);
  return h;
}

function adviceHtml(adv,isToday,hasData){
  if(!isToday&&!adv.insights.length) return '';
  let h='<section class="card tint adv" id="advice"><div class="adv-h">'+bub('sparkle','--accent')+'<h2>Conseils du moment</h2></div>';
  if(adv.insights.length) h+='<ul class="tips">'+adv.insights.slice(0,4).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
  else if(isToday) h+='<p class="small muted">Note une fringale ou ton ressenti après un repas : les conseils se précisent avec ce que tu me dis.</p>';
  if(adv.ideas.length){
    h+='<div><div class="lbl">'+esc(adv.ideasTitle)+'</div>'+(adv.ideasWhy?'<p class="small muted" style="margin-top:2px">'+esc(adv.ideasWhy)+'</p>':'')+adv.ideas.map(i=>'<div class="idea">'+ic('bowl')+'<div><b>'+esc(i.t)+'</b><span>'+esc(i.d)+'</span></div></div>').join('')+'</div>';
  }
  if(adv.move){
    h+='<div class="mv"><h3 style="font-size:17px">'+esc(adv.move.title)+'</h3><ol>'+adv.move.steps.map(s=>'<li><b>'+esc(s.t)+'</b><span>'+esc(s.d)+'</span></li>').join('')+'</ol><p class="small muted">'+esc(adv.moveNote)+'</p></div>';
  }
  if(adv.note) h+='<div class="warn">'+esc(adv.note)+'</div>';
  if(S.canAI&&isToday){
    if(S.ai&&S.ai.busy) h+='<div class="status"><span class="spin"></span><span>Réflexion en cours</span><button class="btn text sm" data-act="ai-stop" style="margin-left:auto">Arrêter</button></div>';
    else{
      if(S.ai&&S.ai.text) h+='<div class="win"><div class="ai-out">'+esc(S.ai.text)+'</div></div>';
      if(S.ai&&S.ai.error) h+='<div class="warn">'+esc(S.ai.error)+'</div>';
      h+='<div class="row"><button class="btn tonal sm" data-act="ai-advice">'+ic('sparkle')+(S.ai&&S.ai.text?'Demander un autre avis':'Avis personnalisé de Claude sur ma journée')+'</button></div>';
    }
  }
  return h+'</section>';
}

function weightChart(ws){
  const a=ws.slice().sort((x,y)=>x.d<y.d?-1:1).slice(-24);
  if(a.length<2) return '<p class="small muted">Ajoute au moins deux pesées pour voir la courbe.</p>';
  const W=320,H=140,pl=34,pr=12,pt=14,pb=24;
  const kgs=a.map(x=>x.kg),lo=Math.floor(Math.min.apply(null,kgs)-0.5),hi=Math.ceil(Math.max.apply(null,kgs)+0.5);
  const x0=parse(a[0].d).getTime(),x1=parse(a[a.length-1].d).getTime()||1;
  const X=d=>pl+(x1===x0?0:(parse(d).getTime()-x0)/(x1-x0))*(W-pl-pr), Y=k=>pt+(hi-k)/(hi-lo)*(H-pt-pb);
  const pts=a.map(w=>X(w.d).toFixed(1)+','+Y(w.kg).toFixed(1)).join(' ');
  const last=a[a.length-1];
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution du poids"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
  [lo,(lo+hi)/2,hi].forEach(v=>{s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/><text x="'+(pl-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+dec(v).replace(',0','')+'</text>'});
  s+='<polygon points="'+X(a[0].d).toFixed(1)+','+(H-pb)+' '+pts+' '+X(last.d).toFixed(1)+','+(H-pb)+'" fill="url(#wg)"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<circle cx="'+X(last.d).toFixed(1)+'" cy="'+Y(last.kg).toFixed(1)+'" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>';
  const fm=d=>new Date(parse(d)).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  s+='<text x="'+pl+'" y="'+(H-6)+'">'+esc(fm(a[0].d))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fm(last.d))+'</text></svg>';
  return s;
}
function intakeChart(p){
  const days=[];for(let i=6;i>=0;i--){const d=addDays(TODAY,-i),ms=getMeals(d);days.push({d:d,k:sumMeals(ms).kcal,logged:ms.length>0,t:targets(p,(phaseFor(p,d)||{kcal:0}).kcal).kcal})}
  const W=320,H=156,pt=16,pb=24,bw=30,gap=(W-20-bw*7)/6;
  const mx=Math.max.apply(null,days.map(x=>Math.max(x.k,x.t)))*1.12;
  const Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calories des 7 derniers jours"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:1"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.45"/></linearGradient></defs>';
  days.forEach((x,i)=>{
    const bx=10+i*(bw+gap),lab=new Date(parse(x.d)).toLocaleDateString('fr-FR',{weekday:'narrow'}),today=x.d===TODAY;
    if(x.logged) s+='<rect x="'+bx.toFixed(1)+'" y="'+Y(x.k).toFixed(1)+'" width="'+bw+'" height="'+(H-pb-Y(x.k)).toFixed(1)+'" rx="9" fill="url(#bg1)"/>';
    else s+='<rect x="'+bx.toFixed(1)+'" y="'+(H-pb-4)+'" width="'+bw+'" height="4" rx="2" fill="var(--line)"/>';
    s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle"'+(today?' style="fill:var(--fg);font-weight:700"':'')+'>'+esc(lab)+'</text>';
  });
  const avgT=days.reduce((a,x)=>a+x.t,0)/7;
  s+='<line x1="4" x2="'+(W-4)+'" y1="'+Y(avgT).toFixed(1)+'" y2="'+Y(avgT).toFixed(1)+'" stroke="var(--sun2)" stroke-width="1.6" stroke-dasharray="4 4"/><text x="'+(W-4)+'" y="'+(Y(avgT)-5).toFixed(1)+'" text-anchor="end">cible moyenne '+fr(avgT)+'</text></svg>';
  return {svg:s,days:days,avgT:avgT};
}
function renderProgress(){
  const p=pn();

  const allMeals=[];for(let i=0;i<7;i++){const ms=getMeals(addDays(TODAY,-i));if(ms.length) allMeals.push(sumMeals(ms))}
  const avgP=allMeals.length?allMeals.reduce((a,x)=>a+x.p,0)/allMeals.length:0;
  const T=targets(p,0), tr=weightTrend(S.weights,TODAY), adv=tweakAdvice(S.profile,tr);

    else msg=ratio>1.1||ratio<0.9?'Tu t’éloignes de ta cible de maintien. Rapproche tes repas de la cible pour stabiliser ton poids.':'Tu es dans ta cible de maintien.';

    h+=Object.keys(bk).map(k=>'<div class="hbar"><span>'+lab[k]+'</span><div class="bar thin"><i style="width:'+(mx?bk[k]/mx*100:0)+'%;--c:var(--carb)"></i></div><span class="tnum">'+bk[k]+'</span></div>').join('');

/* ---------- cuisine ---------- */
const MOODS={
  healthy:['Healthy','léger, riche en légumes et en protéines'],
  confort:['Sain mais réconfortant','plats mijotés, gratins allégés, soupes épaisses : le confort sans excès'],
  cheat:['Cheat meal maîtrisé','un plat plaisir (burger, pizza, pâtes crémeuses, dessert) revisité pour rester raisonnable ; la cible calorique peut monter d’environ 20 %'],
  proteine:['Riche en protéines','au moins 35 g de protéines par portion'],
  rapide:['Rapide (20 min)','prêt en 20 minutes maximum'],
  leger:['Léger du soir','digeste et léger'],
  veg:['Végétarien','sans viande ni poisson']
};
const SLOTS=['Petit-déjeuner','Déjeuner','Collation','Dîner'];
const SHARE={'Petit-déjeuner':.25,'Déjeuner':.35,'Collation':.12,'Dîner':.28};
const r10=v=>Math.round(v/10)*10;

function cookTarget(){
  const p=pn(),ph=phaseFor(p,TODAY),T=targets(p,(ph?ph.kcal:0)+actBonus(getActs(TODAY),p.weight)),tot=sumMeals(getMeals(TODAY));
  let ratio=SHARE[S.cook.slot]||.3;
  if(S.cook.mode==='reste'){ratio=clamp(T.kcal-tot.kcal,250,T.kcal*0.6)/T.kcal}
  return {kcal:r10(T.kcal*ratio),p:Math.round(T.protein*ratio),c:Math.round(T.carbs*ratio),f:Math.round(T.fat*ratio),fib:Math.round(T.fiber*ratio)};
}
function cookTargetAdj(){
  const t=cookTarget(),k=S.cook.moods.indexOf('cheat')>=0?1.2:1;
  return {kcal:r10(t.kcal*k),p:t.p,c:Math.round(t.c*k),f:Math.round(t.f*k),fib:t.fib};
}
function cookCtx(t){
  const c=S.cook,p=pn();
  const moods=c.moods.map(k=>MOODS[k][0]+' ('+MOODS[k][1]+')').join(' ; ')||'aucune consigne particulière';
  return 'Ambiance : '+moods+'.\n'
   +'Repas : '+c.slot+'. Nombre de portions : '+c.portions+(c.batch?' (batch cooking : préparé en une fois puis conservé)':'')+'.\n'
   +'À éviter ou préférences : '+(c.excl.trim()?JSON.stringify(c.excl.trim()):'aucune')+'.\n'
   +'Objectif de la personne : '+GOALS[p.goal]+'.\n'
   +'Cible PAR PORTION : '+t.kcal+' kcal, '+t.p+' g de protéines, '+t.c+' g de glucides, '+t.f+' g de lipides, '+t.fib+' g de fibres.\n';
}
function buildCookPrompt(t){
  const c=S.cook;
  return 'Tu es un chef et nutritionniste. Crée une recette adaptée à la demande ci-dessous et calcule les quantités.\n'
   +'Demande : '+JSON.stringify(c.want.trim())+'\n'+cookCtx(t)
   +'Règles :\n- Dimensionne les quantités PAR PORTION pour approcher cette cible (surtout calories et protéines), avec des valeurs de référence courantes (Ciqual ou USDA), aliments crus sauf indication, huile et assaisonnements gras inclus.\n'
   +'- Liste chaque ingrédient avec sa quantité par portion (un nombre) et son unité parmi : g, ml, pièce, c. à soupe, c. à café, puis les valeurs nutritionnelles de cette quantité.\n'
   +'- Recette réaliste et simple, avec des ingrédients courants en France, de saison (automne) quand c’est pertinent. Respecte strictement les exclusions.\n'
   +(c.batch||c.portions>=3?'- Batch cooking : indique la conservation (frigo et congélateur, durées prudentes), comment réchauffer, et ce qu’il vaut mieux ajouter au dernier moment.\n':'')
   +'- Écris en français. Une phrase par étape, 4 à 8 étapes.\n'
   +'- Réponds uniquement avec un objet JSON, sans texte autour : {"titre":"...","description":"une phrase","tempsPrep":20,"tempsCuisson":30,"ingredients":[{"nom":"...","qte":150,"unite":"g","kcal":0,"proteines":0,"glucides":0,"lipides":0,"fibres":0}],"etapes":["..."],"conservation":"...","astuce":"..."}';
}
function buildIdeasPrompt(t){
  const c=S.cook;
  return 'Tu es un chef et nutritionniste. Propose 4 idées de recettes variées'+(c.want.trim()?' autour de cette envie : '+JSON.stringify(c.want.trim()):'')+'.\n'+cookCtx(t)
   +'Chaque idée doit pouvoir tenir dans la cible par portion, avec des ingrédients courants en France, de saison (automne) quand c’est pertinent. Respecte strictement les exclusions.\n'
   +'Réponds uniquement avec un objet JSON, sans texte autour : {"idees":[{"titre":"...","description":"une phrase appétissante","temps":30,"kcalPortion":550,"tags":["healthy"],"batch":true}]}\nLe champ batch vaut true si la recette se prête bien au batch cooking. Écris en français.';
}
async function cookCalc(){
  const c=S.cook;if(!sampleFn||!c.want.trim()) return;
  const t=cookTargetAdj();
  c.stage='busy';c.what='recipe';c.error='';c.list='';render();window.scrollTo(0,0);
  S.exclude=c.excl;saveState();
  ctl=new AbortController();
  try{
    const r=await sampleFn.json(buildCookPrompt(t),{signal:ctl.signal,modelTier:'default',cache:false});
    const rec=parseRecipe(r);
    if(!rec.ingredients.length) throw {code:'invalid_json'};
    rec.portions=c.portions;rec.slot=c.slot;rec.target=t;rec.batch=c.batch;rec.moods=c.moods.slice();rec.scale=1;
    const nn=recipeNutri(rec);
    if(nn.kcal>0){const f=t.kcal/nn.kcal;if(Math.abs(f-1)>0.07) rec.scale=clamp(Math.round(f*100)/100,0.6,1.6)}
    c.recipe=rec;c.stage='recipe';
  }catch(e){
    c.stage='form';
    if(!(e&&e.code==='cancelled')) c.error=ERR[e&&e.code]||'La connexion a été interrompue. Réessaie.';
  }
  ctl=null;render();window.scrollTo(0,0);
}
async function cookFetchIdeas(){
  const c=S.cook;if(!sampleFn) return;
  const t=cookTargetAdj();
  c.stage='busy';c.what='ideas';c.error='';render();window.scrollTo(0,0);
  S.exclude=c.excl;saveState();
  ctl=new AbortController();
  try{
    const r=await sampleFn.json(buildIdeasPrompt(t),{signal:ctl.signal,modelTier:'default',cache:false});
    const list=(Array.isArray(r&&r.idees)?r.idees:[]).slice(0,5).map(i=>({titre:String(i.titre||'Idée'),description:String(i.description||''),temps:Math.round(n(i.temps)),kcal:Math.round(n(i.kcalPortion)),tags:(Array.isArray(i.tags)?i.tags:[]).map(String).slice(0,3),batch:!!i.batch}));
    if(!list.length) throw {code:'invalid_json'};
    c.ideas=list;c.stage='ideas';
  }catch(e){
    c.stage='form';
    if(!(e&&e.code==='cancelled')) c.error=ERR[e&&e.code]||'La connexion a été interrompue. Réessaie.';
  }
  ctl=null;render();window.scrollTo(0,0);
}
function cookToJournal(){
  const rec=S.cook.recipe;if(!rec) return;
  const sc=rec.scale||1,date=TODAY;
  const items=rec.ingredients.map(i=>({nom:i.nom,qte:fmtQ(i.qte*sc,i.unite),kcal:Math.round(i.kcal*sc),p:r1(i.p*sc),c:r1(i.c*sc),f:r1(i.f*sc),fib:r1(i.fib*sc)}));
  S.days[date]=S.days[date]||{meals:[]};S.days[date].meals=S.days[date].meals||[];
  S.days[date].meals.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:nowStr(),type:rec.slot,titre:rec.titre,items:items});
  saveDay(date);toast('1 portion ajoutée à ton journal');
}
function cookSave(){
  const rec=S.cook.recipe;if(!rec||rec.id) return;
  rec.id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.recipes=[JSON.parse(JSON.stringify(rec))].concat(S.recipes).slice(0,25);
  saveState();render();toast('Recette enregistrée');
}
async function cookCopy(){
  const rec=S.cook.recipe;if(!rec) return;
  const sc=rec.scale||1;
  const text=rec.titre+' ('+rec.portions+(rec.portions>1?' portions':' portion')+')\n'+rec.ingredients.map(i=>'- '+fmtQ(i.qte*sc*rec.portions,i.unite)+' '+i.nom).join('\n');

function buildPrompt(){
  const d=S.draft;
  return 'Tu es un assistant de nutrition. Estime le contenu nutritionnel d’un repas à partir '+(d.file?'de la photo jointe et ':'')+'du commentaire de la personne.\n'
   +'Commentaire : '+(d.comment.trim()?JSON.stringify(d.comment.trim()):'(aucun)')+'\n'
   +'Heure du repas : '+d.time+' ('+d.type+').\n'
   +'Règles :\n- Identifie chaque aliment visible ou cité, estime la portion en grammes ou en unités usuelles, puis les valeurs avec des tables de référence courantes (type Ciqual ou USDA). Les quantités données dans le commentaire priment sur ton estimation visuelle.\n'
   +'- Compte les matières grasses de cuisson ou d’assaisonnement quand elles sont probables, sauf si le commentaire dit le contraire.\n'
   +'- Si ni la photo ni le texte ne montrent de nourriture, renvoie une liste vide et explique-le dans "remarque".\n'
   +'- Réponds uniquement avec un objet JSON, sans texte autour, de la forme :\n'
   +'{"titre":"nom court du repas","confiance":"haute|moyenne|faible","remarque":"une phrase sur tes hypothèses ou ce qu’il faudrait préciser","aliments":[{"nom":"...","quantite":"150 g","kcal":0,"proteines":0,"glucides":0,"lipides":0,"fibres":0}]}\n'
   +'Les kcal sont des entiers. Protéines, glucides, lipides et fibres sont en grammes, avec une décimale au plus. Écris en français.';
}
const ERR={not_granted:'L’analyse automatique n’est pas autorisée sur cette page. Tu peux saisir le repas à la main.',sampling_disabled:'L’analyse automatique n’est pas disponible pour ce compte. Tu peux saisir le repas à la main.',rate_limited:'Trop de demandes pour le moment. Réessaie dans un instant ou saisis le repas à la main.',image_rejected:'Cette image n’a pas pu être lue. Essaie une photo JPEG ou PNG de moins de 20 Mo.',invalid_json:'L’analyse n’a pas donné de résultat exploitable. Ajoute une précision dans le commentaire puis relance.',empty_completion:'L’analyse n’a pas donné de résultat. Ajoute une précision dans le commentaire puis relance.',refused:'Cette demande n’a pas pu être analysée. Précise le commentaire ou saisis à la main.'};
async function analyze(){
  const d=S.draft;if(!d||!sampleFn) return;
  const prevStage=d.stage;
  d.stage='busy';d.error='';render();
  ctl=new AbortController();
  try{
    const opts={signal:ctl.signal,modelTier:'default',cache:false};
    if(d.file) opts.images=d.file;
    const res=await sampleFn.json(buildPrompt(),opts);
    if(S.draft!==d) return;
    const list=Array.isArray(res&&res.aliments)?res.aliments:[];
    d.items=list.map(a=>({nom:String(a.nom||'Aliment'),qte:String(a.quantite||''),kcal:String(Math.round(n(a.kcal))),p:String(r1(n(a.proteines))),c:String(r1(n(a.glucides))),f:String(r1(n(a.lipides))),fib:r1(n(a.fibres))}));
    d.titre=String(res&&res.titre||d.titre||'Repas');
    d.confiance=String(res&&res.confiance||'');
    d.remarque=String(res&&res.remarque||'');
    if(!d.items.length){d.stage='compose';d.error=d.remarque||'Aucun aliment reconnu. Ajoute une précision dans le commentaire.';}
    else d.stage='review';
    freePhotoAfter(d);
  }catch(e){
    if(S.draft!==d) return;
    d.stage=prevStage==='review'?'review':'compose';
    if(!(e&&e.code==='cancelled')) d.error=ERR[e&&e.code]||'La connexion a été interrompue. Réessaie.';
    if(prevStage==='review'&&d.error){d.stage='review';d.remarque=d.error;d.error=''}
  }
  ctl=null;render();
}
function freePhotoAfter(d){/* keep the file in memory only while a re-analysis may need it; it is never stored */}
async function aiAdvice(){
  const p=pn();if(!p||!sampleFn) return;
  const date=TODAY,meals=getMeals(date),cr=getCravings(date),tot=sumMeals(meals),ph=phaseFor(p,date),T=targets(p,ph?ph.kcal:0),plan=planFor(p,date);
  const ml=meals.length?meals.map(m=>{const s=sumItems(m.items);return '- '+m.time+' '+m.type+', « '+m.titre+' » : '+Math.round(s.kcal)+' kcal, '+Math.round(s.p)+' g protéines, '+Math.round(s.c)+' g glucides, '+Math.round(s.f)+' g lipides, '+Math.round(s.fib)+' g fibres'+(m.feel?'. Ressenti après : '+FEEL[m.feel]:'')}).join('\n'):'(aucun repas noté)';
  const cl=cr.length?cr.map(x=>'- '+x.time+', intensité '+FORCE[x.force].toLowerCase()+', envie : '+CTYPE[x.type]+(x.ctx&&x.ctx.length?', contexte : '+x.ctx.map(k=>CTX[k]).join(', '):'')+(x.note?', note : '+x.note:'')+(x.feel?', ressenti : '+FEEL[x.feel]:'')).join('\n'):'(aucune)';
  const prompt='Tu es un coach nutrition et bien-être bienveillant. Voici la journée d’une personne adulte.\n'
   +'Objectif : '+GOALS[p.goal]+'. Heure actuelle : '+nowStr()+'.\n'
   +(ph?'Phase du cycle estimée : '+ph.label+' (jour '+ph.day+').\n':'')
   +'Cibles du jour : '+T.kcal+' kcal, '+T.protein+' g de protéines. Déjà consommé : '+Math.round(tot.kcal)+' kcal, '+Math.round(tot.p)+' g de protéines.\n'
   +'Séance prévue aujourd’hui : '+(plan.rest?'aucune (récupération)':plan.title+', '+plan.min+' min')+'.\n'
   +'Repas du jour :\n'+ml+'\nFringales du jour :\n'+cl+'\nActivités du jour :\n'+(getActs(date).length?getActs(date).map(a=>'- '+a.time+', '+(ACT[a.type]||ACT.autre).l+', '+a.min+' min, intensité '+INTL[a.int].toLowerCase()).join('\n'):'(aucune)')+'\n\n'
   +'Écris en français, en tutoyant, 130 mots au maximum, en phrases courtes, sans markdown, sans titres et sans puces. Fais trois parties séparées par une ligne vide :\n'
   +'1) ce que tu remarques entre ce qu’elle a mangé, ses fringales et son ressenti ;\n'
   +'2) une ou deux idées concrètes pour le prochain repas ou la prochaine collation, adaptées à l’heure, à son objectif et aux cibles restantes ;\n'
   +'3) un geste de mouvement doux pour se sentir mieux.\n'
   +'Règles : ton chaleureux, aucune culpabilisation. Ne recommande jamais de se priver, de sauter un repas ni de compenser par du sport. Ne pose pas de diagnostic. Si les notes montrent une détresse ou des fringales vécues comme incontrôlables, ajoute une phrase pour suggérer d’en parler à un professionnel de santé.';
  S.ai={busy:true,text:'',error:''};render();
  ctl=new AbortController();
  try{
    const r=await sampleFn(prompt,{signal:ctl.signal,modelTier:'default',cache:false});
    S.ai={busy:false,text:r.text.trim(),error:''};
  }catch(e){
    S.ai={busy:false,text:'',error:(e&&e.code==='cancelled')?'':(ERR[e&&e.code]||'La connexion a été interrompue. Réessaie.')};
  }
  ctl=null;render();
}
function saveMeal(){
  const d=S.draft;if(!d) return;
  const fail=msg=>{const x=$('#serr');if(x){x.textContent=msg;x.hidden=false;try{x.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}toast(msg)};
  try{
    const items=d.items.filter(i=>String(i.nom==null?'':i.nom).trim()||n(i.kcal)).map(i=>({nom:String(i.nom==null?'':i.nom).trim()||'Aliment',qte:String(i.qte==null?'':i.qte).trim(),kcal:Math.round(n(i.kcal))||0,p:r1(n(i.p))||0,c:r1(n(i.c))||0,f:r1(n(i.f))||0,fib:r1(n(i.fib))||0}));
    if(!items.length){fail('Ajoute au moins un aliment avec son nom ou ses calories.');return}
    const date=S.viewDate||TODAY;
    const m={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:d.time||nowStr(),type:d.type||'Déjeuner',titre:String(d.titre||'').trim()||d.type||'Repas',items:items};
    if(d.comment&&d.comment.trim()) m.note=d.comment.trim().slice(0,300);
    S.days[date]=S.days[date]||{meals:[]};S.days[date].meals=S.days[date].meals||[];S.days[date].meals.push(m);
    S.draft=null;
    try{freePhoto()}catch(e){}
    try{saveDay(date)}catch(e){S.syncErr=true}
    S.tab='today';S.anim=false;
    render();window.scrollTo(0,0);toast('Repas enregistré');
  }catch(e){
    try{console.error(e)}catch(x){}
    fail('Impossible d’enregistrer : '+(e&&e.message?e.message:'erreur inconnue'));
  }
}

document.addEventListener('submit',function(e){
  const f=e.target.closest('form[data-form]');if(!f) return;
  e.preventDefault();
  if(f.dataset.form==='activity'){
    const date=S.viewDate,fo=f.elements,min=Math.round(n($('#a-min').value));
    if(min<5||min>600){const x=$('#aerr');x.textContent='Indique une durée en minutes, entre 5 et 600.';x.hidden=false;return}
    const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:fo['a-type'].value||'autre',min:min,time:$('#a-time').value||nowStr(),int:Number(fo['a-int'].value)||2};
    const note=$('#a-note').value.trim();if(note) a.note=note.slice(0,120);
    S.days[date]=S.days[date]||{meals:[]};
    S.days[date].activities=S.days[date].activities||[];S.days[date].activities.push(a);
    const cnt=$('#a-count');let cnote='';
    if(cnt&&cnt.checked&&!S.done[date]){S.done[date]=true;saveState();cnote=' Séance du jour validée.'}
    saveDay(date);S.adraft=null;S.tab='today';render();toast('Activité enregistrée.'+cnote);

  }
  if(f.dataset.form==='craving'){
    const date=S.viewDate,fo=f.elements;
    const ctx=Array.prototype.slice.call(f.querySelectorAll('input[name="c-ctx"]:checked')).map(x=>x.value);
    const x={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:$('#c-time').value||nowStr(),force:Number(fo['c-force'].value)||2,type:fo['c-type'].value||'autre',ctx:ctx};
    const note=$('#c-note').value.trim(),fe=$('#c-feel').value;
    if(note) x.note=note.slice(0,200);
    if(fe) x.feel=fe;
    S.days[date]=S.days[date]||{meals:[]};
    S.days[date].cravings=S.days[date].cravings||[];S.days[date].cravings.push(x);
    saveDay(date);S.cdraft=null;S.tab='today';render();
    const o=document.getElementById('advice');if(o) o.scrollIntoView({block:'start'});
    toast('Fringale notée');
    return;
  }
  if(f.dataset.form==='weight'){
    const kg=n($('#w-kg').value),d=$('#w-date').value||TODAY;
    if(kg<25||kg>350){toast('Entre un poids en kilogrammes, par exemple 62,4.');return}
    S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d:d,kg:r1(kg)});saveState();render();toast('Pesée ajoutée');
  } else if(f.dataset.form==='profile'){
    const g=k=>f.elements[k].value, err=m=>{const x=$('#perr');x.textContent=m;x.hidden=false;x.scrollIntoView({block:'center'})};
    const age=n($('#p-age').value),h=n($('#p-h').value),w=n($('#p-w').value);
    if(age<18||age>90) return err('Cette application est prévue pour les adultes de 18 à 90 ans.');
    if(h<120||h>230) return err('Entre une taille en centimètres, par exemple 168.');
    if(w<30||w>300) return err('Entre un poids en kilogrammes, par exemple 62,5.');
    const sex=g('sex'),cyc=sex==='f'&&$('#p-cyc').checked;
    if(cyc&&!$('#p-lp').value) return err('Indique le premier jour de tes dernières règles.');
    if(!g('goal')) return err('Choisis un objectif.');
    const old=S.profile||{};
    S.profile={name:($('#p-name').value||'').trim().slice(0,30),goal:g('goal'),pace:g('pace')||'modere',sex:sex,age:Math.round(age),height:Math.round(h),weight:r1(w),activity:Number($('#p-act').value),days:Number($('#p-days').value),slot:$('#p-slot').value,
      cycleOn:cyc,lastPeriod:cyc?$('#p-lp').value:'',cycleLen:clamp(Math.round(n($('#p-cl').value)||28),21,40),periodLen:clamp(Math.round(n($('#p-pl').value)||5),2,8),tweak:(old.goal===g('goal')?old.tweak:0)||0};
    S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,kg:r1(w)});
    saveState();S.tab='today';render();window.scrollTo(0,0);toast('Profil enregistré');
  }
});

/* ---------- init ---------- */
(function boot(){
  const loc=lsRead();
  if(loc.state){S.profile=loc.state.profile||null;S.weights=loc.state.weights||[];S.done=loc.state.done||{};S.recipes=loc.state.recipes||[];S.exclude=loc.state.exclude||'';S.cook.excl=S.exclude}
  S.days=loc.days||{};
  if(!S.profile){S.tab='profile';S.autoTab=true}
  Promise.race([initCaps(),new Promise(r=>setTimeout(r,450))]).then(function(){S.painted=true;render()});
})();
async function initCaps(){
  const cl=window.claude;
  if(!cl||!cl.use){S.dbChecked=true;return}
  try{
    const r=await Promise.all([cl.use('db').catch(()=>null),cl.use('user').catch(()=>null),cl.use('sample').catch(()=>null)]);
    const dbm=r[0],um=r[1],sm=r[2];
    if(sm){
      sampleFn=sm;S.canAI=true;
      const caps=await sm.limits().catch(()=>null);
      if(caps&&caps.images){S.canPhoto=true;S.accept=(caps.images.mediaTypes||[]).join(',')||'image/*'}
    }
    if(dbm&&um){
      const id=await um.id();
      if(id){coll=dbm.collection('data/users/'+id);await loadFromDb();S.hasDb=true}
    }
  }catch(e){try{console.warn(e)}catch(x){}}
  S.dbChecked=true;
  if(S.painted&&!S.draft&&!S.cdraft&&!S.adraft) render();
}
async function loadFromDb(){
  const snap=await coll.get();let st=null;const rd={};
  snap.docs.forEach(function(doc){
    let dt=doc.data();if(!dt) return;try{dt=JSON.parse(JSON.stringify(dt))}catch(e){return}
    if(doc.id==='state') st=dt;else if(doc.id.indexOf('day-')===0) rd[doc.id.slice(4)]=dt;
  });
  if(st){S.profile=st.profile||S.profile;S.weights=st.weights||S.weights;S.done=st.done||S.done;S.recipes=st.recipes||S.recipes;S.exclude=st.exclude||S.exclude;S.cook.excl=S.exclude}
  else if(S.profile){saveState()}
  Object.keys(rd).forEach(d=>{S.days[d]=rd[d]});
  Object.keys(S.days).forEach(d=>{const dy=S.days[d];if(!rd[d]&&((dy.meals||[]).length||(dy.cravings||[]).length||(dy.activities||[]).length)) queue(()=>coll.doc('day-'+d).set({meals:dy.meals||[],cravings:dy.cravings||[],activities:dy.activities||[]}))});
  mirror();
  if(S.autoTab&&S.profile&&S.tab==='profile'){S.tab='today'}
}
})();
